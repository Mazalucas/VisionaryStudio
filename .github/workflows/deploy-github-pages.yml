# Build estático (Vite) y publicación en GitHub Pages.
# Requisitos en el repo: Settings → Pages → Source: GitHub Actions.
# Secreto FIREBASE_APPLET_CONFIG_JSON (JSON del SDK web en Firebase Console) para generar firebase-applet-config.json en CI.
# Gemini opcional: GEMINI_API_KEY en la build o claves en la app (localStorage).
# URL: https://<usuario>.github.io/<nombre-repo>/

name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write Firebase web app config
        env:
          FIREBASE_APPLET_CONFIG_JSON: ${{ secrets.FIREBASE_APPLET_CONFIG_JSON }}
        run: node scripts/write-firebase-applet-config.mjs

      - name: Build
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
